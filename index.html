<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Judy &amp; Karma</title>
    <meta name="description" content="مهام يومية ونجوم ومكافآت ومفاجآت لـ جودي وكارما" />
    <meta name="theme-color" content="#FFB800" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Judy &amp; Karma" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* Palette mirrored from the Android app (colors.xml) */
      :root{
        color-scheme: light;
        --cream:#FFF8EC; --cream-dark:#F3E3C3;
        --card:#FFFFFF; --card-soft:#FFFBF3;
        --ink:#3E2F23; --gray:#8A7A68; --line:#EFDFC2;
        --gold:#FFB800; --gold-dark:#D97706; --gold-light:#FFF1C4;
        --rose:#F472A0; --rose-dark:#D6336C; --rose-light:#FDE7F0;
        --violet:#8B5CF6; --violet-dark:#6D28D9; --violet-light:#EFE7FD;
        --green:#34B26B; --green-light:#E2F5E9;
        --red:#E0524D; --icon-bg:#FFE9B8;
        --shadow:0 4px 14px rgba(160,120,40,.10);
        --shadow-big:0 14px 40px rgba(120,80,20,.25);
        --radius:24px;
      }
      *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
      html{ scroll-behavior:smooth; }
      body{
        margin:0; color:var(--ink); background:var(--cream);
        font-family:"Baloo Bhaijaan 2","Segoe UI",Tahoma,system-ui,sans-serif;
        min-height:100vh;
        padding: env(safe-area-inset-top) 0 calc(28px + env(safe-area-inset-bottom));
      }
      button, input, select{ font-family:inherit; }
      button{ min-height:44px; }
      .wrap{ max-width:680px; margin:0 auto; padding:16px 16px 10px; }

      /* ---------- Header (Android: 27sp bold, centered) ---------- */
      .hero{ text-align:center; }
      .hero h1{ margin:0; font-size:1.75rem; font-weight:800; line-height:1.3; }
      .hero .dates{ color:var(--gray); font-weight:600; font-size:1rem; margin-top:2px; }

      /* ---------- Girl cards (Android drawables: light fill, colored stroke) ---------- */
      .girls{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px; }
      .girl{
        border-radius:var(--radius); padding:12px; text-align:center; cursor:pointer;
        width:100%; color:var(--ink); transition:transform .15s ease;
      }
      .girl:active{ transform:scale(.97); }
      .girl.judy{ background:var(--rose-light); border:2px solid var(--rose); }
      .girl.karma{ background:var(--violet-light); border:2px solid var(--violet); }
      .girl.judy.sel{ border:5px solid var(--rose-dark); padding:9px; }
      .girl.karma.sel{ border:5px solid var(--violet-dark); padding:9px; }
      .girl .gname{ display:block; font-size:1.4rem; font-weight:800; line-height:1.25; }
      .girl.judy .gname{ color:var(--rose-dark); }
      .girl.karma .gname{ color:var(--violet-dark); }
      .girl .today-line{ display:block; color:var(--ink); font-weight:600; font-size:.95rem; margin-top:6px; }
      .girl .bar{ display:block; height:14px; border-radius:8px; background:var(--cream-dark); margin-top:6px; overflow:hidden; }
      .girl .bar i{ display:block; height:100%; border-radius:8px; background:var(--gold); transition:width .5s ease; }
      .girl .balance{ display:block; font-size:1.15rem; font-weight:800; color:var(--gold-dark); margin-top:6px; }
      .girl .balance .st{ display:inline-block; }
      .girl .balance.bump .st{ animation:bump .6s ease; }
      @keyframes bump{ 0%{transform:scale(1)} 35%{transform:scale(1.7) rotate(18deg)} 100%{transform:scale(1)} }

      /* ---------- Praise banner (Android praiseText card) ---------- */
      .praise{
        display:none; margin-top:12px; background:var(--card); border:2px solid var(--line);
        border-radius:var(--radius); padding:10px; text-align:center;
        color:var(--gold-dark); font-size:1.2rem; font-weight:800;
      }
      .praise.show{ display:block; animation:fadein .25s ease; }
      @keyframes fadein{ from{ opacity:0 } to{ opacity:1 } }

      /* ---------- Sections ---------- */
      .section-title{ margin:16px 0 4px; font-size:1.32rem; font-weight:800; }

      /* ---------- Task rows (Android bg_card + round check) ---------- */
      .task{
        display:flex; align-items:center; gap:12px; background:var(--card);
        border:2px solid var(--line); border-radius:var(--radius);
        padding:10px 14px; margin-top:8px;
      }
      .task .ic{
        width:52px; height:52px; flex:0 0 52px; font-size:2rem;
        display:flex; align-items:center; justify-content:center;
      }
      .task .mid{ flex:1; min-width:0; }
      .task .tname{ font-size:1.2rem; font-weight:800; line-height:1.3; }
      .task .tstars{ color:var(--gold-dark); font-weight:800; font-size:.95rem; }
      .check{
        width:58px; height:58px; flex:0 0 58px; border-radius:50%;
        border:4px solid var(--gold); background:var(--card);
        font-size:1.65rem; font-weight:800; color:var(--gold); cursor:pointer;
        display:flex; align-items:center; justify-content:center;
        transition:transform .15s ease, background .2s, border-color .2s, color .2s;
      }
      .check:active{ transform:scale(.88); }
      .task.done .check{ background:var(--green); border-color:var(--green); color:#fff; }
      .empty-note{ text-align:center; color:var(--gray); font-weight:700; padding:18px 8px; }

      /* ---------- Big nav buttons (Android: gold + soft, radius 28, 60dp) ---------- */
      .nav-btns{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:18px; }
      .btn-gold{
        height:60px; border:none; border-radius:28px; background:var(--gold); color:var(--ink);
        font-size:1.2rem; font-weight:800; cursor:pointer; transition:transform .12s, background .15s;
      }
      .btn-gold:active{ background:var(--gold-dark); transform:scale(.97); }
      .btn-soft{
        height:60px; border-radius:28px; background:var(--card); color:var(--gold-dark);
        border:2px solid var(--gold-dark); font-size:1.2rem; font-weight:800; cursor:pointer;
        transition:transform .12s, background .15s;
      }
      .btn-soft:active{ background:var(--cream-dark); transform:scale(.97); }

      /* ---------- Rewards (Android reward rows) ---------- */
      .reward{
        display:flex; align-items:center; gap:12px; background:var(--card);
        border:2px solid var(--line); border-radius:var(--radius);
        padding:12px 14px; margin-top:10px;
      }
      .reward .ric{
        width:56px; height:56px; flex:0 0 56px; font-size:2.25rem;
        display:flex; align-items:center; justify-content:center;
      }
      .reward .mid{ flex:1; min-width:0; }
      .reward .rname{ font-weight:800; font-size:1.2rem; line-height:1.3; }
      .reward .rprice{ color:var(--gold-dark); font-weight:800; font-size:1rem; }
      .buy{
        flex:0 0 auto; height:54px; border:none; border-radius:28px; padding:0 18px;
        font-size:1rem; font-weight:800; background:var(--gold); color:var(--ink); cursor:pointer;
        transition:transform .12s, background .15s;
      }
      .buy:active{ background:var(--gold-dark); transform:scale(.96); }
      .buy:disabled{
        background:var(--card); border:2px solid var(--gold-dark); color:var(--gray); cursor:not-allowed;
      }

      /* ---------- Overlay / modals ---------- */
      .overlay{
        position:fixed; inset:0; background:rgba(62,47,35,.55);
        display:none; align-items:center; justify-content:center; padding:18px; z-index:60;
      }
      .overlay.open{ display:flex; }
      .modal{
        background:var(--card); color:var(--ink); border-radius:28px; box-shadow:var(--shadow-big);
        max-width:430px; width:100%; max-height:88vh; overflow:auto; padding:22px 20px; text-align:center;
        animation:pop .3s ease;
      }
      @keyframes pop{ from{ transform:scale(.85); opacity:0 } to{ transform:scale(1); opacity:1 } }
      .modal .big-emoji{ font-size:3.4rem; line-height:1.15; }
      .modal h2{ margin:6px 0 4px; font-size:1.5rem; font-weight:800; }
      .modal p{ margin:4px 0; color:var(--gray); font-weight:700; line-height:1.6; }
      .modal .cta{
        margin-top:14px; width:100%; border:none; border-radius:28px; padding:13px; min-height:54px;
        font-size:1.15rem; font-weight:800; color:var(--ink); cursor:pointer; background:var(--gold);
      }
      .modal .cta:active{ background:var(--gold-dark); }
      .modal .ghost{
        margin-top:8px; width:100%; border:2px solid var(--gold-dark); background:var(--card); color:var(--gold-dark);
        border-radius:28px; padding:11px; font-size:1.05rem; font-weight:800; cursor:pointer;
      }
      .modal input.pin{
        width:180px; padding:12px; font-size:1.6rem; text-align:center; letter-spacing:.35em;
        border:2px solid var(--line); border-radius:16px; background:var(--card-soft); color:var(--ink);
        font-weight:800; margin-top:12px;
      }
      .modal .err{ display:none; color:var(--red); font-weight:800; margin-top:10px; }
      .modal .err.show{ display:block; }
      .shake{ animation:shake .4s ease; }
      @keyframes shake{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(7px)} 75%{transform:translateX(-7px)} }

      /* praise toast (small events: uncheck, saves) */
      .toast{
        position:fixed; top:calc(14px + env(safe-area-inset-top)); left:50%; transform:translate(-50%,-140%);
        z-index:70; background:var(--card); color:var(--ink); border-radius:20px; box-shadow:var(--shadow-big);
        padding:12px 20px; font-size:1.2rem; font-weight:800; text-align:center; max-width:92vw;
        transition:transform .35s cubic-bezier(.2,1.4,.4,1); border:3px solid var(--gold);
      }
      .toast.show{ transform:translate(-50%,0); }
      .toast small{ display:block; font-size:.95rem; color:var(--gray); }

      #confetti{ position:fixed; inset:0; pointer-events:none; z-index:65; overflow:hidden; }
      .confetto{ position:absolute; top:-4vh; border-radius:3px; animation:fall linear forwards; }
      @keyframes fall{ to{ transform:translateY(112vh) rotate(720deg); } }
      .fly-star{
        position:fixed; z-index:66; font-size:2.4rem; pointer-events:none;
        transition:all .8s cubic-bezier(.3,.7,.4,1); text-shadow:0 4px 14px rgba(255,150,0,.6);
      }
      @media (prefers-reduced-motion: reduce){
        .confetto{ display:none; } *{ animation-duration:.001s !important; transition-duration:.001s !important; }
      }

      /* ---------- Welcome / install choice screen ---------- */
      #welcomeOverlay{ z-index:90; background:var(--cream); padding:22px; }
      #welcomeOverlay .modal{ background:transparent; box-shadow:none; max-width:440px; }
      #welcomeOverlay .app-icon{
        width:104px; height:104px; border-radius:26px; box-shadow:var(--shadow-big);
        background:var(--icon-bg);
      }
      #welcomeOverlay h2{ font-size:1.9rem; margin-top:12px; }
      #welcomeOverlay .wsub{ color:var(--gray); font-size:1.05rem; }
      #welcomeOverlay .wbtn{ margin-top:14px; width:100%; min-height:62px; font-size:1.25rem; }
      .guide{
        display:none; margin-top:16px; background:var(--card); border:2px solid var(--line);
        border-radius:var(--radius); padding:16px; text-align:start;
      }
      .guide.show{ display:block; }
      .guide .step{ display:flex; gap:10px; align-items:flex-start; font-weight:700; font-size:1.05rem; line-height:1.55; margin:10px 0; color:var(--ink); }
      .guide .step .n{
        flex:0 0 30px; width:30px; height:30px; border-radius:50%; background:var(--gold);
        color:var(--ink); font-weight:800; display:flex; align-items:center; justify-content:center; font-size:1rem;
      }
      .guide .note{ color:var(--gray); font-size:.92rem; font-weight:700; margin-top:8px; }
      .ios-arrow{
        display:none; position:fixed; bottom:calc(10px + env(safe-area-inset-bottom)); left:50%;
        transform:translateX(-50%); font-size:2.6rem; z-index:91; color:var(--gold-dark);
        animation:bounceDown 1s ease infinite; pointer-events:none;
        text-shadow:0 2px 10px rgba(255,255,255,.9);
      }
      .ios-arrow.show{ display:block; }
      @keyframes bounceDown{ 0%,100%{ transform:translate(-50%,0) } 50%{ transform:translate(-50%,12px) } }

      /* ---------- Parents ---------- */
      #parents{ display:none; margin-top:8px; }
      #parents.open{ display:block; }
      .panel{ background:var(--card); border:2px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:14px; }
      .panel h3{ margin:0 0 10px; font-size:1.2rem; font-weight:800; }
      .tabs{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
      .tab{
        flex:1; min-width:100px; border:2px solid var(--line); background:var(--card); color:var(--ink);
        border-radius:28px; padding:10px 6px; font-weight:800; font-size:1rem; cursor:pointer;
      }
      .tab.on{ background:var(--gold); border-color:var(--gold); color:var(--ink); }
      .change-pin{
        width:100%; height:50px; margin-bottom:14px; border-radius:28px; background:var(--card);
        border:2px solid var(--gold-dark); color:var(--gold-dark); font-weight:800; font-size:1rem; cursor:pointer;
      }
      .row-item{ display:flex; align-items:center; gap:10px; padding:10px 6px; border-bottom:1px solid var(--line); }
      .row-item:last-child{ border-bottom:none; }
      .row-item .e{ font-size:1.5rem; }
      .row-item .n{ flex:1; font-weight:800; line-height:1.3; }
      .row-item .n small{ display:block; color:var(--gray); font-weight:700; }
      .mini{
        border-radius:28px; padding:8px 14px; font-weight:800; cursor:pointer; font-size:.95rem;
        background:var(--card); color:var(--gold-dark); border:2px solid var(--gold-dark); min-height:40px;
      }
      .mini.del{ color:var(--red); border-color:var(--red); }
      form.f{ display:grid; gap:10px; margin-top:6px; }
      form.f label{ font-weight:800; font-size:.98rem; }
      form.f input[type="text"], form.f input[type="number"], form.f select, input[type="date"], input[type="month"]{
        width:100%; padding:11px 12px; border:2px solid var(--line); border-radius:14px;
        background:var(--card-soft); color:var(--ink); font-size:1.05rem; font-weight:700; min-height:48px;
      }
      .emoji-pick{ display:flex; flex-wrap:wrap; gap:6px; }
      .emoji-pick button{
        width:46px; height:46px; min-height:46px; font-size:1.35rem; border-radius:13px; cursor:pointer;
        border:2px solid var(--line); background:var(--card-soft);
      }
      .emoji-pick button.on{ border-color:var(--gold); background:var(--gold-light); transform:scale(1.08); }
      .save-btn{
        border:none; border-radius:28px; padding:13px; min-height:54px; font-size:1.1rem; font-weight:800;
        color:var(--ink); cursor:pointer; background:var(--gold);
      }
      .danger-btn{
        border:2px solid var(--red); background:transparent; color:var(--red); border-radius:28px;
        padding:11px; font-weight:800; width:100%; cursor:pointer; font-size:1rem;
      }
      .rep-controls{ display:grid; grid-template-columns:1fr auto; gap:10px; align-items:end; margin-bottom:6px; }
      .rep-controls label{ font-weight:800; display:block; margin-bottom:4px; }
      .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:10px 0; }
      .stat{ background:var(--card-soft); border:2px solid var(--line); border-radius:16px; padding:12px; text-align:center; }
      .stat .v{ font-size:1.5rem; font-weight:800; }
      .stat .k{ color:var(--gray); font-weight:700; font-size:.9rem; }
      .day-row{
        display:flex; align-items:center; gap:10px; width:100%; text-align:start; background:var(--card-soft);
        border:2px solid var(--line); border-radius:14px; padding:10px 12px; margin-bottom:8px; cursor:pointer;
        color:var(--ink); font-weight:800; font-size:1rem;
      }
      .day-row .grow{ flex:1; }
      .day-row small{ color:var(--gray); font-weight:700; display:block; }
      .ev{ display:flex; gap:9px; padding:7px 2px; border-bottom:1px dashed var(--line); font-weight:700; align-items:baseline; }
      .ev:last-child{ border-bottom:none; }
      .ev .t{ color:var(--gray); font-size:.85rem; flex:0 0 58px; }
      .ev .plus{ color:var(--green); font-weight:800; }
      .ev .minus{ color:var(--red); font-weight:800; }
      .girl-head{ font-size:1.15rem; font-weight:800; margin:14px 0 4px; }
      .girl-head.j{ color:var(--rose-dark); } .girl-head.k{ color:var(--violet-dark); }
      .hidden{ display:none !important; }
    </style>
  </head>

    <div class="toast" id="toast" role="status"></div>

      /* ================= SHA-256 (for the parents' favorite number) ================= */
      function sha256Sync(ascii){
        function rr(v,a){ return (v>>>a)|(v<<(32-a)); }
        var maxWord = Math.pow(2,32), result = "";
        var words = [], asciiBitLength = ascii.length*8;
        var hash = sha256Sync.h = sha256Sync.h || [], k = sha256Sync.k = sha256Sync.k || [];
        var primeCounter = k.length, isComposite = {};
        for(var candidate = 2; primeCounter < 64; candidate++){
          if(!isComposite[candidate]){
            for(var i = 0; i < 313; i += candidate) isComposite[i] = candidate;
            hash[primeCounter] = (Math.pow(candidate,.5)*maxWord)|0;
            k[primeCounter++] = (Math.pow(candidate,1/3)*maxWord)|0;
          }
        }
        ascii += "\x80";
        while(ascii.length % 64 - 56) ascii += "\x00";
        for(var i2 = 0; i2 < ascii.length; i2++){
          var j = ascii.charCodeAt(i2); if(j >> 8) return sha256Sync(unescape(encodeURIComponent(ascii)));
          words[i2>>2] |= j << ((3-i2)%4)*8;
        }
        words[words.length] = (asciiBitLength/maxWord)|0;
        words[words.length] = asciiBitLength;
        for(var j2 = 0; j2 < words.length;){
          var w = words.slice(j2, j2 += 16), oldHash = hash;
          hash = hash.slice(0,8);
          for(var i3 = 0; i3 < 64; i3++){
            var w15 = w[i3-15], w2 = w[i3-2];
            var a = hash[0], e = hash[4];
            var temp1 = hash[7]
              + (rr(e,6)^rr(e,11)^rr(e,25))
              + ((e&hash[5])^((~e)&hash[6]))
              + k[i3]
              + (w[i3] = (i3 < 16) ? w[i3] : (
                  w[i3-16]
                  + (rr(w15,7)^rr(w15,18)^(w15>>>3))
                  + w[i3-7]
                  + (rr(w2,17)^rr(w2,19)^(w2>>>10))
                )|0);
            var temp2 = (rr(a,2)^rr(a,13)^rr(a,22)) + ((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
            hash = [(temp1+temp2)|0].concat(hash);
            hash[4] = (hash[4]+temp1)|0;
          }
          for(var i4 = 0; i4 < 8; i4++) hash[i4] = (hash[i4]+oldHash[i4])|0;
        }
        for(var i5 = 0; i5 < 8; i5++){
          for(var j3 = 3; j3 + 1; j3--){
            var b = (hash[i5]>>(j3*8))&255;
            result += ((b < 16) ? "0" : "") + b.toString(16);
          }
        }
        return result;
      }
      function sha256hex(str){
        if(window.crypto && crypto.subtle && window.TextEncoder){
          return crypto.subtle.digest("SHA-256", new TextEncoder().encode(str)).then(function(buf){
            return Array.prototype.map.call(new Uint8Array(buf), function(b){
              return ("0" + b.toString(16)).slice(-2);
            }).join("");
          }).catch(function(){ return sha256Sync(str); });
        }
        return Promise.resolve(sha256Sync(str));
      }

        g.gain.setValueAtTime(0.0001, actx.currentTime + t);
        g.gain.exponentialRampToValueAtTime(0.22, actx.currentTime + t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + t + dur);
        o.connect(g); g.connect(actx.destination);
        o.start(actx.currentTime + t); o.stop(actx.currentTime + t + dur + 0.05);
      }

          delete r.done[taskId];
          S.balances[girl] -= task.stars;
          logEvent(key, girl, "uncheck", "اتشالت علامة: " + task.name, -task.stars);

            S.balances[girl] -= 1;
            logEvent(key, girl, "uncheck", "رجعت نجمة المفاجأة بتاعة: " + task.name, -1);
          }
          if(day.twin[taskId]){
            delete day.twin[taskId];
            S.balances[girl] -= 1; S.balances[og] -= 1;
            logEvent(key, girl, "twin-off", "اتلغت نجمة قوة التوأم: " + task.name, -1);
            logEvent(key, og, "twin-off", "اتلغت نجمة قوة التوأم: " + task.name, -1);

            r.fullDay = false;

          hidePraise();
          toast("اتشالت العلامة ↩️", GIRLS[girl].name + " تقدر تعلمها تاني لما تخلصها");
          return;
        }

        /* ---- check ---- */
        var surpriseMsg = null;
        if(Math.random() < 0.2){
          surpriseMsg = SECRET_MESSAGES[Math.floor(Math.random() * SECRET_MESSAGES.length)];
        }
        r.done[taskId] = { time: nowTime(), surpriseStar: surpriseMsg ? 1 : 0 };
        S.balances[girl] += task.stars;
        logEvent(key, girl, "task", "خلصت: " + task.name, task.stars);
        playHappy(false);
        confetti(34);
        flyStar(btnEl, girl);

        var twinHit = false, fullHit = false;

        if(surpriseMsg){
          S.balances[girl] += 1;
          logEvent(key, girl, "surprise", surpriseMsg, 1);
        }

        /* twin bonus */

          S.balances[girl] += 1; S.balances[og] += 1;
          logEvent(key, girl, "twin", "قوة التوأم 👯 في: " + task.name, 1);
          logEvent(key, og, "twin", "قوة التوأم 👯 في: " + task.name, 1);
        }

        /* full day */
        var mine = tasksFor(girl);
        var doneCount = mine.filter(function(t){ return !!r.done[t.id]; }).length;

          logEvent(key, girl, "fullday", "يوم كامل! خلصت كل مهام اليوم 🏅", 3);

        var v = $("gateInput").value.trim();
        if(gateMode === "setup1" || gateMode === "chg2"){
          if(!isValidPin(v)){ gateFail("الرقم لازم يكون ٣ أرقام بالضبط"); return; }
          gateTemp = v;
          startGate(gateMode === "setup1" ? "setup2" : "chg3");
          return;
        }
        if(gateMode === "setup2" || gateMode === "chg3"){
          if(v !== gateTemp){
            startGate(gateMode === "setup2" ? "setup1" : "chg2", "الرقمين مش زي بعض — عيدي من الأول");
            return;
          }
          sha256hex(v).then(function(h){
            try{ localStorage.setItem(PIN_KEY, h); }catch(e){}
            if(gateMode === "setup2"){
              unlockParents();
            } else {
              $("gateOverlay").classList.remove("open");
              toast("اتغيّر الرقم المفضل 🔑", "المرة الجاية ادخلي بالرقم الجديد");
            }
          });
          return;
        }
        /* entry / chg1: verify against the stored hash */
        if(!isValidPin(v)){ gateFail("الرقم مش صح، حاولي تاني"); return; }
        sha256hex(v).then(function(h){
          if(h === storedPinHash()){
            if(gateMode === "entry") unlockParents();
            else startGate("chg2");
          } else {
            gateFail("الرقم مش صح، حاولي تاني");
          }
        });
      }
      $("parentsBtn").addEventListener("click", function(){
        if(parentsUnlocked){ $("parents").scrollIntoView({ behavior:"smooth" }); return; }
        startGate(storedPinHash() ? "entry" : "setup1");
      });
      $("changePinBtn").addEventListener("click", function(){ startGate("chg1"); });
      $("gateOk").addEventListener("click", tryGate);
      $("gateInput").addEventListener("keydown", function(e){ if(e.key === "Enter") tryGate(); });
      $("gateInput").addEventListener("input", function(){
        var v = $("gateInput").value.replace(/[^0-9]/g, "").slice(0, 3);
        if(v !== $("gateInput").value) $("gateInput").value = v;
      });
      $("gateCancel").addEventListener("click", function(){ $("gateOverlay").classList.remove("open"); });

      /* tabs */
      document.querySelectorAll(".tab").forEach(function(tab){
        tab.addEventListener("click", function(){
          document.querySelectorAll(".tab").forEach(function(x){ x.classList.remove("on"); });
          tab.classList.add("on");
          ["tasks","rewards","reports"].forEach(function(name){
            $("tab-" + name).classList.toggle("hidden", name !== tab.getAttribute("data-tab"));
          });
          if(tab.getAttribute("data-tab") === "reports") renderReports();
        });
      });

      /* ================= Parents: CRUD ================= */
      var editTaskId = null, editRewardId = null;
      var tfEmojiSel = EMOJIS[0], rfEmojiSel = EMOJIS[17];

      function buildPicker(boxId, current, onPick){
        var box = $(boxId);
        box.innerHTML = EMOJIS.map(function(e){
          return '<button type="button" data-e="' + e + '" class="' + (e === current ? "on" : "") + '">' + e + '</button>';
        }).join("");
        box.querySelectorAll("button").forEach(function(b){
          b.addEventListener("click", function(){
            box.querySelectorAll("button").forEach(function(x){ x.classList.remove("on"); });
            b.classList.add("on"); onPick(b.getAttribute("data-e"));
          });
        });
      }
      function girlLabel(g){ return g === "both" ? "جودي وكارما" : GIRLS[g].name; }

      function renderAdmin(){
        $("adminTaskList").innerHTML = S.tasks.length ? S.tasks.map(function(t){
          return '<div class="row-item"><span class="e">' + t.emoji + '</span>' +
            '<span class="n">' + esc(t.name) + '<small>⭐ ' + t.stars + " • " + girlLabel(t.girl) + '</small></span>' +
            '<button class="mini" type="button" data-et="' + t.id + '">تعديل</button>' +
            '<button class="mini del" type="button" data-dt="' + t.id + '">حذف</button></div>';
        }).join("") : '<div class="empty-note">مفيش مهام</div>';
        $("adminTaskList").querySelectorAll("[data-et]").forEach(function(b){
          b.addEventListener("click", function(){ startEditTask(b.getAttribute("data-et")); });
        });
        $("adminTaskList").querySelectorAll("[data-dt]").forEach(function(b){
          b.addEventListener("click", function(){
            var id = b.getAttribute("data-dt");
            var t = S.tasks.find(function(x){ return x.id === id; });
            showModal("🗑️", "نحذف المهمة دي؟", "«" + esc(t.name) + "» هتتشال من الجدول. النجوم اللي اتجمعت منها قبل كده هتفضل زي ما هي.", "أيوه، احذف", function(){
              S.tasks = S.tasks.filter(function(x){ return x.id !== id; });
              if(editTaskId === id) cancelEditTask();
              save(); renderAll();
            }, true);
          });
        });
        $("adminRewardList").innerHTML = S.rewards.length ? S.rewards.map(function(rw){
          return '<div class="row-item"><span class="e">' + rw.emoji + '</span>' +
            '<span class="n">' + esc(rw.name) + '<small>⭐ ' + rw.price + ' نجمة</small></span>' +
            '<button class="mini" type="button" data-er="' + rw.id + '">تعديل</button>' +
            '<button class="mini del" type="button" data-dr="' + rw.id + '">حذف</button></div>';
        }).join("") : '<div class="empty-note">مفيش مكافآت</div>';
        $("adminRewardList").querySelectorAll("[data-er]").forEach(function(b){
          b.addEventListener("click", function(){ startEditReward(b.getAttribute("data-er")); });
        });
        $("adminRewardList").querySelectorAll("[data-dr]").forEach(function(b){
          b.addEventListener("click", function(){
            var id = b.getAttribute("data-dr");
            var rw = S.rewards.find(function(x){ return x.id === id; });
            showModal("🗑️", "نحذف المكافأة دي؟", "«" + esc(rw.name) + "» هتتشال من قائمة المكافآت.", "أيوه، احذف", function(){
              S.rewards = S.rewards.filter(function(x){ return x.id !== id; });
              if(editRewardId === id) cancelEditReward();
              save(); renderAll();
            }, true);
          });
        });
      }
      function startEditTask(id){
        var t = S.tasks.find(function(x){ return x.id === id; }); if(!t) return;
        editTaskId = id;
        $("tfName").value = t.name; $("tfStars").value = t.stars; $("tfGirl").value = t.girl;
        tfEmojiSel = t.emoji;
        buildPicker("tfEmoji", tfEmojiSel, function(e){ tfEmojiSel = e; });
        $("taskFormTitle").textContent = "✏️ تعديل مهمة";
        $("taskSaveBtn").textContent = "حفظ التعديل ✅";
        $("taskCancelEdit").classList.remove("hidden");
        $("taskForm").scrollIntoView({ behavior:"smooth", block:"center" });
      }
      function cancelEditTask(){
        editTaskId = null;
        $("taskForm").reset(); $("tfStars").value = 1; $("tfGirl").value = "both";
        tfEmojiSel = EMOJIS[0];
        buildPicker("tfEmoji", tfEmojiSel, function(e){ tfEmojiSel = e; });
        $("taskFormTitle").textContent = "➕ إضافة مهمة";
        $("taskSaveBtn").textContent = "حفظ المهمة ✅";
        $("taskCancelEdit").classList.add("hidden");
      }
      $("taskCancelEdit").addEventListener("click", cancelEditTask);
      $("taskForm").addEventListener("submit", function(e){
        e.preventDefault();
        var name = $("tfName").value.trim(); if(!name) return;
        var stars = Math.max(1, Math.min(10, parseInt($("tfStars").value, 10) || 1));
        var girl = $("tfGirl").value;
        if(editTaskId){
          var t = S.tasks.find(function(x){ return x.id === editTaskId; });
          t.name = name; t.emoji = tfEmojiSel; t.stars = stars; t.girl = girl;
          cancelEditTask();
        } else {
          S.tasks.push({ id: uid("t"), name: name, emoji: tfEmojiSel, stars: stars, girl: girl });
          $("taskForm").reset(); $("tfStars").value = 1;
        }
        save(); renderAll();
        toast("اتحفظت المهمة ✅", "");
      });

      function startEditReward(id){
        var rw = S.rewards.find(function(x){ return x.id === id; }); if(!rw) return;
        editRewardId = id;
        $("rfName").value = rw.name; $("rfPrice").value = rw.price;
        rfEmojiSel = rw.emoji;
        buildPicker("rfEmoji", rfEmojiSel, function(e){ rfEmojiSel = e; });
        $("rewardFormTitle").textContent = "✏️ تعديل مكافأة";
        $("rewardSaveBtn").textContent = "حفظ التعديل ✅";
        $("rewardCancelEdit").classList.remove("hidden");
        $("rewardForm").scrollIntoView({ behavior:"smooth", block:"center" });
      }
      function cancelEditReward(){
        editRewardId = null;
        $("rewardForm").reset(); $("rfPrice").value = 10;
        rfEmojiSel = EMOJIS[17];
        buildPicker("rfEmoji", rfEmojiSel, function(e){ rfEmojiSel = e; });
        $("rewardFormTitle").textContent = "➕ إضافة مكافأة";
        $("rewardSaveBtn").textContent = "حفظ المكافأة ✅";
        $("rewardCancelEdit").classList.add("hidden");
      }
      $("rewardCancelEdit").addEventListener("click", cancelEditReward);
      $("rewardForm").addEventListener("submit", function(e){
        e.preventDefault();
        var name = $("rfName").value.trim(); if(!name) return;
        var price = Math.max(1, Math.min(999, parseInt($("rfPrice").value, 10) || 10));
        if(editRewardId){
          var rw = S.rewards.find(function(x){ return x.id === editRewardId; });
          rw.name = name; rw.emoji = rfEmojiSel; rw.price = price;
          cancelEditReward();
        } else {
          S.rewards.push({ id: uid("r"), name: name, emoji: rfEmojiSel, price: price });
          $("rewardForm").reset(); $("rfPrice").value = 10;
        }
        save(); renderAll();
        toast("اتحفظت المكافأة ✅", "");
      });

      $("resetBtn").addEventListener("click", function(){
        showModal("⚠️", "مسح كل البيانات؟", "كل النجوم والسجلات والتقارير هتتمسح، والمهام والمكافآت هترجع للافتراضية. ده مش هيترجع فيه!", "أيوه، امسح الكل", function(){
          S = seed(); save(); currentGirl = "judy";
          cancelEditTask(); cancelEditReward(); renderAll(); renderReports();
          toast("بدأنا من جديد ⭐", "");
        }, true);
      });

      /* ================= Reports ================= */
      function evIcon(type){
        return { task:"✅", uncheck:"↩️", surprise:"🎁", twin:"👯", "twin-off":"👯", fullday:"🏅", "fullday-off":"🏅", redeem:"🎁" }[type] || "•";
      }
      function renderDayReport(key){
        var box = $("dayReport");
        var day = S.days[key];
        var html = '<p style="font-weight:800;margin:8px 0 0">📅 ' + esc(fmtDateAr(key)) + "</p>";
        if(!day || (!day.judy.events.length && !day.karma.events.length)){
          box.innerHTML = html + '<div class="empty-note">مفيش نشاط مسجل في اليوم ده</div>';
          return;
        }
        GIRL_KEYS.forEach(function(g){
          var r = day[g];
          var mine = tasksFor(g);
          var doneList = mine.filter(function(t){ return !!r.done[t.id]; });
          html += '<div class="girl-head ' + (g === "judy" ? "j" : "k") + '">' + GIRLS[g].emoji + " " + GIRLS[g].name +
            ' — خلصت ' + doneList.length + " من " + mine.length + " مهام • كسبت ⭐ " + earnedOn(key, g) + " النهارده" +
            (r.fullDay ? " • 🏅 يوم كامل" : "") + "</div>";
          if(!r.events.length){ html += '<div class="empty-note">لا نشاط</div>'; return; }
          html += r.events.map(function(e){
            var d = e.delta > 0 ? '<span class="plus">+' + e.delta + '⭐</span>'
                  : e.delta < 0 ? '<span class="minus">' + e.delta + '⭐</span>' : "";
            return '<div class="ev"><span class="t">' + fmtTime(e.time) + '</span><span>' + evIcon(e.type) + " " + esc(e.text) + '</span><span style="flex:1"></span>' + d + "</div>";
          }).join("");
        });
        box.innerHTML = html;
      }
      function renderMonthReport(ym){
        var box = $("monthReport");
        var parts = ym.split("-"); var y = +parts[0], m = +parts[1];
        var keys = Object.keys(S.days).filter(function(k){
          var p = k.split("-"); return +p[0] === y && +p[1] === m;
        }).sort();
        var monthName = new Intl.DateTimeFormat("ar-EG", { month:"long", year:"numeric" }).format(new Date(y, m - 1, 1));
        var html = '<p style="font-weight:800;margin:8px 0 0">🗓️ ' + esc(monthName) + "</p>";
        if(!keys.length){
          box.innerHTML = html + '<div class="empty-note">مفيش نشاط مسجل في الشهر ده</div>';
          return;
        }
        GIRL_KEYS.forEach(function(g){
          var totalEarned = 0, doneSlots = 0, totalSlots = 0, fullDays = 0;
          var taskCounts = {};
          keys.forEach(function(k){
            var r = S.days[k][g];
            totalEarned += earnedOn(k, g);
            var mine = tasksFor(g);
            totalSlots += mine.length;
            mine.forEach(function(t){ if(r.done[t.id]){ doneSlots++; taskCounts[t.id] = (taskCounts[t.id] || 0) + 1; } });
            if(r.fullDay) fullDays++;
          });
          var pct = totalSlots ? Math.round(doneSlots / totalSlots * 100) : 0;
          var best = null, bestN = 0;
          Object.keys(taskCounts).forEach(function(id){
            if(taskCounts[id] > bestN){ bestN = taskCounts[id]; best = S.tasks.find(function(t){ return t.id === id; }); }
          });
          html += '<div class="girl-head ' + (g === "judy" ? "j" : "k") + '">' + GIRLS[g].emoji + " " + GIRLS[g].name + "</div>" +
            '<div class="stat-grid">' +
            '<div class="stat"><div class="v">⭐ ' + totalEarned + '</div><div class="k">نجوم اتكسبت في الشهر</div></div>' +
            '<div class="stat"><div class="v">' + pct + '%</div><div class="k">نسبة إنجاز المهام</div></div>' +
            '<div class="stat"><div class="v">🏅 ' + fullDays + '</div><div class="k">أيام كاملة</div></div>' +
            '<div class="stat"><div class="v">' + (best ? best.emoji + " " + bestN + " مرة" : "—") + '</div><div class="k">أكتر مهمة اتعملت' + (best ? ": " + esc(best.name) : "") + '</div></div>' +
            "</div>";
        });
        html += '<p style="font-weight:800;margin:12px 0 6px">الأيام اللي فيها نشاط — دوس على أي يوم لعرض تفاصيله:</p>';
        html += keys.slice().reverse().map(function(k){
          var ej = earnedOn(k, "judy"), ek = earnedOn(k, "karma");
          var dj = Object.keys(S.days[k].judy.done).length, dk = Object.keys(S.days[k].karma.done).length;
          return '<button class="day-row" type="button" data-day="' + k + '"><span>📅</span><span class="grow">' + esc(fmtDateAr(k)) +
            "<small>" + GIRLS.judy.name + ": " + dj + " مهام • ⭐" + ej + " &nbsp;—&nbsp; " + GIRLS.karma.name + ": " + dk + " مهام • ⭐" + ek + "</small></span><span>‹</span></button>";
        }).join("");
        box.innerHTML = html;
        box.querySelectorAll("[data-day]").forEach(function(b){
          b.addEventListener("click", function(){
            var k = b.getAttribute("data-day");
            $("repDay").value = k;
            renderDayReport(k);
            $("repDay").scrollIntoView({ behavior:"smooth", block:"center" });
          });
        });
      }
      function renderReports(){
        if(!$("repDay").value) $("repDay").value = todayKey();
        if(!$("repMonth").value){ var d = new Date(); $("repMonth").value = d.getFullYear() + "-" + pad(d.getMonth() + 1); }
        renderDayReport($("repDay").value);
        renderMonthReport($("repMonth").value);
      }
      $("repDayBtn").addEventListener("click", function(){ if($("repDay").value) renderDayReport($("repDay").value); });
      $("repMonthBtn").addEventListener("click", function(){ if($("repMonth").value) renderMonthReport($("repMonth").value); });

      /* ================= Welcome / install choice ================= */
      var deferredPrompt = null;
      window.addEventListener("beforeinstallprompt", function(e){
        e.preventDefault();
        deferredPrompt = e;
      });
      function isStandalone(){
        return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
      }
      function welcomeDoneToday(){
        try{ return localStorage.getItem(WELCOME_KEY) === todayKey(); }catch(e){ return false; }
      }
      function markWelcomeDone(){ try{ localStorage.setItem(WELCOME_KEY, todayKey()); }catch(e){} }
      function hideWelcome(){
        $("welcomeOverlay").classList.remove("open");
        $("iosArrow").classList.remove("show");
      }
      window.addEventListener("appinstalled", function(){ markWelcomeDone(); hideWelcome(); });

      function showInstallGuide(){
        var ua = navigator.userAgent || "";
        var isIOS = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        var isAndroid = /android/i.test(ua);
        var steps, note = "";
        if(isIOS){
          steps = [
            "اضغطي زر <b>المشاركة</b> ⬆️ اللي تحت في شريط سفاري",
            "من القائمة اختاري <b>«إضافة إلى الشاشة الرئيسية»</b>",
            "اضغطي <b>«إضافة»</b> — هتلاقي أيقونة Judy &amp; Karma على شاشتك ⭐"
          ];
          note = "لو الصفحة مفتوحة جوه تطبيق تاني (زي واتساب)، افتحيها في سفاري الأول من زرار المتصفح.";
          $("iosArrow").classList.add("show");
        } else if(isAndroid){
          steps = [
            "اضغطي قائمة النقط <b>⋮</b> اللي فوق في كروم",
            "اختاري <b>«تثبيت التطبيق»</b> أو <b>«إضافة إلى الشاشة الرئيسية»</b>",
            "اضغطي <b>«تثبيت»</b> — هتلاقي أيقونة Judy &amp; Karma على شاشتك ⭐"
          ];
          $("iosArrow").classList.remove("show");
        } else {
          steps = [
            "افتحي قائمة المتصفح <b>⋮</b> أو <b>☰</b>",
            "اختاري <b>«تثبيت التطبيق»</b> أو <b>«إضافة إلى الشاشة الرئيسية»</b>",
            "أكدي التثبيت — هتلاقي أيقونة Judy &amp; Karma جاهزة ⭐"
          ];
          $("iosArrow").classList.remove("show");
        }
        $("installGuide").innerHTML =
          steps.map(function(s, i){
            return '<div class="step"><span class="n">' + (i + 1) + '</span><span>' + s + '</span></div>';
          }).join("") +
          (note ? '<div class="note">' + note + '</div>' : "") +
          '<button class="btn-gold" id="guideDone" type="button" style="width:100%;margin-top:12px">تمام، فهمت ✅</button>';
        $("installGuide").classList.add("show");
        $("guideDone").addEventListener("click", function(){ markWelcomeDone(); hideWelcome(); });
        $("installGuide").scrollIntoView({ behavior:"smooth", block:"nearest" });
      }
      $("wInstall").addEventListener("click", function(){
        if(deferredPrompt){
          var dp = deferredPrompt; deferredPrompt = null;
          dp.prompt();
          dp.userChoice.then(function(choice){
            if(choice && choice.outcome === "accepted"){ markWelcomeDone(); hideWelcome(); }
            else showInstallGuide();
          }).catch(function(){ showInstallGuide(); });
        } else {
          showInstallGuide();
        }
      });
      $("wBrowser").addEventListener("click", function(){ markWelcomeDone(); hideWelcome(); });

      /* ================= Init ================= */
      buildPicker("tfEmoji", tfEmojiSel, function(e){ tfEmojiSel = e; });
      buildPicker("rfEmoji", rfEmojiSel, function(e){ rfEmojiSel = e; });
      renderAll();
      if(!isStandalone() && !welcomeDoneToday()){
        $("welcomeOverlay").classList.add("open");
      }
    </script>
  </body>
</html>
